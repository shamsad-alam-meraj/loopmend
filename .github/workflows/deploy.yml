name: Deploy

# Production: CI must pass, then reviewed migrations are applied, then the app
# is deployed to Vercel and smoke-tested. Previews deploy for pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: 22
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Apply database migrations (production)
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Check required secret
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then echo "::error::Set the DATABASE_URL secret on the production environment"; exit 1; fi
      - name: Run reviewed Drizzle migrations
        # Use the Supabase *session* pooler or direct connection for DDL (not the 6543 transaction pooler).
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-production:
    name: Deploy to Vercel (production)
    if: github.event_name != 'pull_request'
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - name: Post-deployment smoke test
        run: bash infrastructure/scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"

  deploy-preview:
    name: Deploy preview (pull request)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global vercel@latest
      - name: Skip when Vercel is not configured
        id: guard
        run: echo "enabled=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.enabled == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - if: steps.guard.outputs.enabled == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - if: steps.guard.outputs.enabled == 'true'
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.enabled == 'true'
        run: bash infrastructure/scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${{ steps.deploy.outputs.url }}`,
            });
